name: Validate release

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check workflow syntax
        run: |
          python -m py_compile scripts/*.py
          bash -n scripts/05_run_mmseqs.sh
      - name: Validate final release
        run: |
          (cd data && sha256sum -c SHA256SUMS)
          python scripts/10_validate_release.py \
            data/releases/TF_PWM_chart_final.tsv \
            --structural-exclusions \
            data/model_predictions/wrong_model_modcre.txt \
            data/model_predictions/wrong_model_af3.txt

